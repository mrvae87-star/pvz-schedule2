<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Прокси для Zvonok</title>
</head>
<body>
    <h2>📞 Прокси-сервер для Zvonok.com</h2>
    <p>Этот прокси помогает обойти CORS ограничения.</p>
    <div id="status">Готов к работе...</div>

    <script>
        // Прокси-сервер для обхода CORS
        (function() {
            const params = new URLSearchParams(window.location.search);
            const action = params.get('action');
            const phone = params.get('phone');
            const message = params.get('message');
            const campaignId = "96603739";
            const publicKey = "6ec133ae14476ac8fb7f7e68a8591296";

            if (action === 'call' && phone) {
                document.getElementById('status').innerHTML = '📞 Отправка звонка...';
                
                const url = `https://zvonok.com/manager/cabapi_external/api/v1/phones/call/?campaign_id=${campaignId}&phone=%2B${phone}&public_key=${publicKey}`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('status').innerHTML = `
                            ✅ Звонок отправлен!
                            <br>📊 Ответ: <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                        console.log('✅ Ответ:', data);
                    })
                    .catch(err => {
                        document.getElementById('status').innerHTML = `
                            ❌ Ошибка: ${err.message}
                        `;
                        console.error('❌ Ошибка:', err);
                    });
            } else if (action === 'status' && phone) {
                document.getElementById('status').innerHTML = '📊 Проверка статуса...';
                
                const url = `https://zvonok.com/manager/cabapi_external/api/v1/phones/calls_by_phone/?campaign_id=${campaignId}&phone=%2B${phone}&public_key=${publicKey}`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('status').innerHTML = `
                            📊 Статус звонков:
                            <br><pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                        console.log('📊 Статус:', data);
                    })
                    .catch(err => {
                        document.getElementById('status').innerHTML = `
                            ❌ Ошибка: ${err.message}
                        `;
                        console.error('❌ Ошибка:', err);
                    });
            } else {
                document.getElementById('status').innerHTML = `
                    ℹ️ Используйте параметры:
                    <br>• ?action=call&phone=79299007708 - для звонка
                    <br>• ?action=status&phone=79299007708 - для проверки статуса
                `;
            }
        })();
    </script>
</body>
</html>
